# ─────────────────────────────────────────────────────────────
# 자동매매 전략 · 리스크 설정
#   cp config.example.yaml config.yaml  후 config.yaml 을 수정하세요.
#   금액 단위: 원(KRW), 시가총액·거래대금 기준: 억원, 퍼센트: 1.5 = 1.5%
#   시각은 모두 한국시간(KST) "HH:MM"
# ─────────────────────────────────────────────────────────────

schedule:
  opening_range_end: "09:15"   # 09:00~09:15 고가/저가 = 오프닝 레인지(OR)
  entry_start: "09:15"         # 신규 진입 허용 시작
  entry_end: "14:30"           # 신규 진입 마감 (이후는 보유 종목 관리만)
  no_entry_windows:            # 진입 금지 구간 (점심시간 등 거래 한산)
    - ["11:30", "13:00"]
  force_exit: "15:15"          # 당일 청산 시각 (15:20 동시호가 전에 전량 정리)
  poll_seconds: 5              # 시세 확인 주기(초)

universe:                      # ── 종목 선정 기준 (블로그의 '숫자로 된 기준') ──
  rank_top_n: 10               # 당일 거래대금 순위 상위 N 위까지만
  rank_market: "J"             # J=KRX, NX=NXT, UN=통합
  # 순위 조회 제외 플래그 10자리(1=제외):
  #   투자위험/경고/주의, 관리종목, 정리매매, 불성실공시, 우선주, 거래정지, ETF, ETN, 신용주문불가, SPAC
  exclude_flags: "1111111101"
  min_price: 2000              # 동전주 제외 (원)
  max_price: 1000000
  min_market_cap_eok: 3000     # 시가총액 하한 (억원)
  # 시각별 최소 누적 거래대금(억원). 장 마감 기준 1,000억을 시간대별로 나눠 적용
  min_turnover_schedule:
    "09:15": 150
    "09:30": 250
    "10:30": 400
    "12:00": 600
    "14:00": 800
  min_change_pct: 2.0          # 전일 대비 상승률 하한 (%)
  max_change_pct: 20.0         # 너무 오른 종목(상한가 근처) 추격 금지
  require_program_net_buy: true    # 프로그램 순매수 > 0 필수
  require_foreign_net_buy: false   # 외국인 순매수 > 0 필수 (장중 집계는 추정치라 기본 off)
  near_high_pct: 5.0           # 52주 최고가 대비 -5% 이내면 '신고가 근접' 태그
  require_near_high: false     # true면 신고가 근접 종목만
  refresh_minutes: 5           # 후보 종목 재선정 주기 (테마 순환 대응)
  # Claude 장전 분석(watchlist) 반영 방식:
  #   off   = 무시
  #   boost = Claude 추천 종목 우선 + 회피 종목 제외 (기본)
  #   only  = Claude 추천 종목만 매매
  claude_watchlist: boost

strategy:                      # ── ORB + VWAP 돌파 전략 ──
  breakout_buffer_pct: 0.1     # OR 고가를 0.1% 이상 넘긴 1분봉 종가에서 진입 신호
  max_or_range_pct: 6.0        # OR 폭이 6% 넘으면 손절 폭이 커지므로 제외
  volume_surge_ratio: 1.5      # 돌파 봉 거래량 ≥ 직전 N봉 평균 × 1.5
  volume_lookback_bars: 10
  max_stop_pct: 1.5            # 손절: OR 저가와 -1.5% 중 더 가까운 값
  take_profit_pct: 3.0         # 익절 +3%
  trail_activate_pct: 1.5      # +1.5% 도달 시 추적손절 시작 (손절선을 본전 위로)
  trail_pct: 1.0               # 고점 대비 -1% 이탈 시 청산
  vwap_exit: true              # 1분봉 종가가 VWAP 아래로 내려가면 청산
  upper_limit_buffer_pct: 7.0  # 상한가까지 7% 이내면 진입 금지
  entry_slippage_ticks: 2      # 매수 지정가 = 현재가 + 2호가 (체결 확률 ↑, 과도한 추격 방지)
  entry_timeout_seconds: 20    # 미체결 시 취소
  max_entries_per_symbol: 1    # 종목당 하루 1회만 (물타기/재진입 금지)

risk:                          # ── 하드 리스크 한도 (Claude도 완화할 수 없음) ──
  capital_krw: 5000000         # 자동매매 운용자금 (원). 0이면 계좌 총평가금액 전체를 기준으로 계산
                               #   ※ 장기 보유 종목이 있는 계좌라면 꼭 설정하세요 (엔진은 자기가 산 종목만 매도)
  risk_per_trade_pct: 0.5      # 1회 매매 최대 손실 = 계좌의 0.5%
  max_position_pct: 25         # 1종목 최대 비중 = 계좌의 25%
  max_order_krw: 2000000       # 1회 주문 최대 금액 (실전 초기엔 작게!)
  max_open_positions: 2
  max_trades_per_day: 4
  max_consecutive_losses: 2    # 연속 2패 → 그날 매매 종료
  max_daily_loss_pct: 1.0      # 일 손실 -1% → 신규 진입 중단
  flatten_on_daily_loss: true  #   + 보유 종목 즉시 청산
  daily_profit_target_pct: 1.0 # 일 수익 +1% 달성 → 그날은 더 이상 진입 안 함 ('조금씩 벌기')
  risk_off_size_multiplier: 0.5  # Claude가 market_view=risk_off 판단 시 사이즈 배수 (0 = 매매 중지)
  max_api_errors: 10           # 연속 API 오류 N회 → 매매 중단

costs:
  commission_pct: 0.015        # 매수·매도 각각 수수료 (%) — 본인 계좌 수수료로 수정
  sell_tax_pct: 0.20           # 매도 시 증권거래세+농특세 (%) — 세율 변경 시 수정
  slippage_ticks: 1            # 드라이런/백테스트 체결 가정 슬리피지 (호가 단위)

api:
  rate_per_sec_real: 10        # 실전 서버 초당 호출 수 (공식 한도보다 낮게)
  rate_per_sec_paper: 2        # 모의투자 서버는 한도가 낮음
  timeout_seconds: 10
